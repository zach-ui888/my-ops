[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-testcase-generator"
version = "0.1.0"
description = "TG testcase generator phase-one offline core"
requires-python = ">=3.10"
dependencies = ["pypdf==6.1.1", "Pillow==11.3.0", "defusedxml==0.7.1"]

[tool.setuptools.packages.find]
where = ["src"]
